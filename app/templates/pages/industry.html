{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold">{{ industry_slug.replace('-', ' ').title() }} Templates</h1>
    <p class="mt-2 text-brand-muted">Industry-focused templates built for faster launches.</p>
    <div class="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
        {% for item in pagination["items"] %}
            {% include "components/template_card.html" %}
        {% endfor %}
    </div>
</section>
{% endblock %}
