<section class="border-t border-brand-border pt-10 first:border-t-0 first:pt-0">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold">Popular in {{ section.category.name }}</h2>
            <p class="mt-1 text-sm text-brand-muted">{{ section.total_count }} templates · updated weekly</p>
        </div>
        <a href="/popular?category={{ section.category.slug }}" class="text-sm font-semibold text-brand-dark hover:text-brand-emerald">
            View all {{ section.category.name }} templates
        </a>
    </div>
    <div class="mt-5 rounded-xl border border-brand-border bg-white px-4 sm:px-6">
        {% for item in section.templates %}
            {% include "components/template_list_row.html" %}
        {% endfor %}
    </div>
</section>
