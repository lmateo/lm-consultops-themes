{% if pagination["page_count"] > 1 %}
<nav aria-label="Pagination" class="mt-40px">
    <ul class="pagination pagination-style-01 justify-content-center mb-0">
        {% for link in page_urls %}
        <li class="page-item{% if link.current %} active{% endif %}">
            <a href="{{ link.url }}" class="page-link"{% if link.current %} aria-current="page"{% endif %}>{{ link.page }}</a>
        </li>
        {% endfor %}
    </ul>
</nav>
{% endif %}
