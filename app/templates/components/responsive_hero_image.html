{% set base = "/static/images/templates/" ~ slug %}
<picture>
    <source
        media="(max-width: 768px)"
        srcset="{{ base }}/hero-mobile.webp"
        type="image/webp"
    />
    <source
        media="(min-width: 769px)"
        srcset="{{ base }}/hero.webp 1600w, {{ base }}/preview.webp 1440w"
        sizes="(min-width: 1280px) 66vw, 100vw"
        type="image/webp"
    />
    <img
        src="{{ base }}/hero.webp"
        srcset="{{ base }}/hero-mobile.webp 900w, {{ base }}/hero.webp 1600w, {{ base }}/preview.webp 1440w"
        sizes="(max-width: 768px) 100vw, (min-width: 1280px) 66vw, 100vw"
        alt="{{ alt }}"
        width="1600"
        height="900"
        loading="eager"
        fetchpriority="high"
        decoding="async"
        class="{{ image_class | default('h-96 w-full rounded-2xl border border-brand-border object-cover') }}"
    />
</picture>
