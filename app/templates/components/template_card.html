<article class="group overflow-hidden rounded-2xl border border-brand-border bg-white shadow-soft transition duration-200 hover:-translate-y-1 hover:border-emerald-200 hover:shadow-xl">
    <a href="/templates/{{ item.slug }}" class="block aspect-[5/3] overflow-hidden bg-slate-100">
        {% include "components/responsive_card_image.html" %}
    </a>
    <div class="space-y-3 p-5">
        <div class="flex items-center justify-between gap-2 text-xs">
            <span class="rounded-full bg-emerald-50 px-2 py-1 font-medium text-brand-dark">{{ item.category.name }}</span>
            <span class="text-brand-muted">{{ item.last_updated.strftime("%b %d, %Y") }}</span>
        </div>
        <p class="text-xs font-medium text-brand-muted">Industry: {{ item.industry.name }}</p>
        <h3 class="text-lg font-semibold leading-tight">
            <a href="/templates/{{ item.slug }}" class="hover:text-brand-emerald">{{ item.title }}</a>
        </h3>
        <p class="line-clamp-2 text-sm text-brand-muted">{{ item.description }}</p>
        <p class="text-xs font-medium text-brand-muted">Ready for launch</p>
        <p class="text-sm font-semibold text-brand-ink">${{ "%.2f"|format(item.price) }}</p>
        <div class="flex gap-2">
            <a href="/preview/{{ item.slug }}" class="flex-1 rounded-lg border border-brand-border px-3 py-2 text-center text-sm font-medium hover:bg-slate-50">Live Preview</a>
            <a href="/templates/{{ item.slug }}" class="flex-1 rounded-lg bg-brand-emerald px-3 py-2 text-center text-sm font-medium text-white hover:bg-brand-dark">Details</a>
        </div>
    </div>
</article>
